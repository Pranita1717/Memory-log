
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:#020817;

            color:white;
        }

        .container{

            width:420px;

            background:#1e293b;

            padding:40px;

            border-radius:20px;

            box-shadow:0 0 20px rgba(0,0,0,0.4);
        }

        .title{

            text-align:center;

            font-size:38px;

            margin-bottom:35px;

            font-weight:bold;
        }

        .input-group{

            margin-bottom:22px;
        }

        .input-group label{

            display:block;

            margin-bottom:10px;

            font-size:18px;
        }

        .input-group input,
        .input-group select{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:#334155;

            color:white;

            font-size:16px;
        }

        .input-group input::placeholder{

            color:#cbd5e1;
        }

        .btn{

            width:100%;

            padding:16px;

            border:none;

            border-radius:14px;

            background:#2563eb;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        .btn:hover{

            background:#1d4ed8;
        }

        .error{

            background:#dc2626;

            padding:12px;

            border-radius:10px;

            margin-bottom:20px;

            text-align:center;
        }

        .login-link{

            text-align:center;

            margin-top:20px;
        }

        .login-link a{

            color:#60a5fa;

            text-decoration:none;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="title">

            Create Account

        </div>

        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}

        <form
            method="POST"
            action="/register"
        >

            <!-- USERNAME -->

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required
                >

            </div>

            <!-- PASSWORD -->

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

            </div>

            <!-- ROLE -->

            <div class="input-group">

                <label>Select Role</label>

                <select
                    name="role"
                    id="roleSelect"
                    required
                >

                    <option value="patient">

                        Patient

                    </option>

                    <option value="caregiver">

                        Caregiver

                    </option>

                </select>

            </div>

            <!-- CAREGIVER PATIENT LINK -->

            <div
                class="input-group"
                id="patientLinkBox"
                style="display:none;"
            >

                <label>

                    Linked Patient Username

                </label>

                <input
                    type="text"
                    name="linked_patient"
                    placeholder="Enter Patient Username"
                >

            </div>

            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="btn"
            >

                Register

            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="/login_form">

                Login

            </a>

        </div>

    </div>

    <script>

        const roleSelect =
            document.getElementById("roleSelect");

        const patientLinkBox =
            document.getElementById("patientLinkBox");

        roleSelect.addEventListener(
            "change",
            function(){

                if(this.value === "caregiver"){

                    patientLinkBox.style.display = "block";

                }else{

                    patientLinkBox.style.display = "none";

                }

            }
        );

    </script>

</body>

</html>
